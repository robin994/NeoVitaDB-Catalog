name: Build catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every six hours: picks up new releases from the homebrew repositories.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema

      - name: Build
        env:
          # Raises the API budget from 60 to 5000 calls an hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_catalog.py

      - name: Stage icons alongside the catalog
        run: cp -r icons dist/icons

      # On pull requests we stop here: the build having succeeded is the check.
      # Besides the checksum cache, the build also rewrites each entry's
      # "trusted" flag in apps/*.json in place when its star count crosses
      # TRUSTED_STARS, and it tracks lifetime download totals in
      # cache/downloads.json (see accumulate_downloads() in build_catalog.py) -
      # both need committing back too, or the next run loses the running state.
      - name: Commit refreshed caches and trust flags
        if: github.event_name != 'pull_request'
        run: |
          git add cache/hashes.json cache/downloads.json apps
          if git diff --cached --quiet; then
            echo "nothing to refresh"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh caches and trust flags"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
