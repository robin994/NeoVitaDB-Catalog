name: Build catalog

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: picks up new releases from the homebrew repositories. Push to
    # main (a merged PR) triggers a build immediately regardless of this.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: build_catalog.py derives
      # each entry's "added" date from git log (first commit touching its
      # apps/*.json), which needs the actual commit history to walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jsonschema

      - name: Build
        env:
          # Raises the API budget from 60 to 5000 calls an hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/build_catalog.py

      - name: Stage website
        run: |
          cp site/index.html dist/index.html
          cp site/developers.html dist/developers.html
          cp site/style.css dist/style.css
          cp site/script.js dist/script.js

      - name: Stage icons alongside the catalog
        # icons_vita/ publishes to dist/icons/ (unchanged path, kept exactly
        # where already-published clients expect vita icons); icons_psp/ gets
        # its own new served path since nothing depends on it yet.
        run: |
          cp -r icons_vita dist/icons
          cp -r icons_psp dist/icons_psp

      # On pull requests we stop here: the build having succeeded is the check.
      # Besides the checksum cache, the build also rewrites each entry's
      # "trusted" flag in apps/*.json in place when its author's membership in
      # trusted_authors.json changes, and it tracks lifetime download totals in
      # cache/downloads.json (see accumulate_downloads() in build_catalog.py) -
      # both need committing back too, or the next run loses the running state.
      - name: Commit refreshed caches and trust flags
        if: github.event_name != 'pull_request'
        run: |
          git add cache/hashes.json cache/downloads.json apps
          if git diff --cached --quiet; then
            echo "nothing to refresh"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh caches and trust flags"
            # This checkout is fetch-depth 1 and can go stale over the several
            # minutes the build takes (one API call per app): a scheduled run
            # and a manual workflow_dispatch overlapping, or a push landing on
            # main mid-run, both make a plain "git push" get rejected as
            # non-fast-forward. Rebase onto whatever is new on main and retry
            # a few times instead of failing the whole build over a race.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::git push kept getting rejected after 5 attempts"
                exit 1
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                # A real content conflict (not just a fast-forward gap) means
                # two runs' independently-regenerated cache files disagree -
                # nothing worth reconciling line-by-line, since both sides
                # are just derived data. Drop the botched rebase and recommit
                # this run's already-built working tree on top of the new
                # main instead. (A bare `git rebase origin/main` failure
                # would otherwise kill this whole step immediately under
                # GitHub Actions' implicit `bash -e`, skipping every
                # remaining retry.)
                git rebase --abort
                git reset --soft origin/main
                git diff --cached --quiet || git commit -m "Refresh caches and trust flags"
              fi
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
